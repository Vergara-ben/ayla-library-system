# Render Blueprint for AYLA. The database is Supabase PostgreSQL (set the DATABASE_* values).
services:
  - type: web
    name: ayla-library
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    # Daphne serves the pages and the live-update WebSocket from one process.
    startCommand: daphne --bind 0.0.0.0 --port $PORT --proxy-headers ayla_library_system.asgi:application
    healthCheckPath: /healthz/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DAILY_TASK_TOKEN
        generateValue: true
      - key: DATABASE_ENGINE
        value: postgresql
      - key: DATABASE_SSLMODE
        value: require
      - key: DATABASE_NAME
        sync: false
      - key: DATABASE_USER
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: DATABASE_HOST
        sync: false
      - key: DATABASE_PORT
        value: "5432"
      # Mail. Render's free plan blocks outbound SMTP, so Gmail cannot be used
      # here: send over an HTTPS API instead. Set EMAIL_PROVIDER to 'brevo' and
      # paste the Brevo API key into EMAIL_API_KEY in the Render dashboard.
      # Until both are set the app still runs, but it reports that codes could
      # not be emailed rather than pretending they were sent.
      - key: EMAIL_PROVIDER
        sync: false
      - key: EMAIL_API_KEY
        sync: false
      # e.g. Ayla Public Library <no-reply@yourdomain>  (must be a Brevo-verified sender)
      - key: DEFAULT_FROM_EMAIL
        sync: false

# The overdue sweep and visit close-out. Nothing runs them on their own: either
