{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayla Admin Panel - Edit Patron</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Rowdies:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #060d13;
            --bg-sidebar: #0b151e;
            --bg-card: #0d1b26;
            --bg-modal: #0f2230;
            --bg-input: #15293a;
            --text-primary: #e2e8f0;
            --text-muted: #64748b;
            --border-color: #1e293b;
            --border-modal: #1d354a;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
        }

        .logo-text {
            font-family: 'Rowdies', sans-serif;
        }

        .success-message {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: #15803d;
            color: white;
            padding: 16px 24px;
            border-radius: 8px;
            display: none;
            z-index: 1000;
            animation: slideIn 0.3s ease-out;
        }

        .error-message {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: #dc2626;
            color: white;
            padding: 16px 24px;
            border-radius: 8px;
            display: none;
            z-index: 1000;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
    <script src="{% static 'js/supabase-config.js' %}"></script>
    <script src="{% static 'js/button-handlers.js' %}"></script>
</head>
<body class="flex h-screen overflow-hidden relative">

    <div class="flex-1 flex filter blur-[6px] pointer-events-none select-none w-full h-full">
        <aside class="w-64 flex-shrink-0 flex flex-col" style="background-color: var(--bg-sidebar); border-right: 1px solid var(--border-color);">
            <div class="p-6 flex items-center gap-3" style="border-bottom: 1px solid var(--border-color);">
                <div class="w-10 h-10 rounded-lg flex items-center justify-center text-xl font-bold text-cyan-400 bg-cyan-950/50">A</div>
                <div>
                    <h1 class="logo-text text-xl tracking-wider text-slate-100">AYLA</h1>
                </div>
            </div>
            <nav class="flex-1 px-4 py-6 space-y-6">
                <div class="w-full h-4 bg-slate-800/40 rounded"></div>
                <div class="w-full h-24 bg-slate-800/20 rounded"></div>
                <div class="w-full h-24 bg-slate-800/20 rounded"></div>
            </nav>
        </aside>
        <div class="flex-1 flex flex-col p-8 space-y-6">
            <div class="h-10 w-48 bg-slate-800/40 rounded mb-4"></div>
            <div class="grid grid-cols-4 gap-4">
                <div class="h-24 bg-slate-800/30 rounded-xl"></div>
                <div class="h-24 bg-slate-800/30 rounded-xl"></div>
                <div class="h-24 bg-slate-800/30 rounded-xl"></div>
                <div class="h-24 bg-slate-800/30 rounded-xl"></div>
            </div>
            <div class="flex-1 bg-slate-800/20 rounded-xl"></div>
        </div>
    </div>

    <div class="absolute inset-0 bg-black/60 z-40 flex items-center justify-center p-4 overflow-y-auto">
        
        <div class="w-full max-w-lg rounded-2xl border p-6 flex flex-col gap-5 shadow-2xl relative my-auto" 
             style="background-color: var(--bg-modal); border-color: var(--border-modal);">
            
            <div class="flex items-center justify-between">
                <h3 class="text-base font-bold text-slate-200 tracking-wide">Edit Patron</h3>
                <button class="w-7 h-7 rounded-lg flex items-center justify-center text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 border border-slate-700/40 transition-colors">
                    <i class="fa-solid fa-xmark text-sm"></i>
                </button>
            </div>

            <form method="post" action="{% url 'admin_edit_patron' patron.patron_id %}" class="space-y-4 text-xs">
                {% csrf_token %}
                {% if error %}
                    <div class="rounded-xl border border-rose-500/20 bg-rose-500/10 px-4 py-3 text-sm text-rose-100">{{ error }}</div>
                {% elif success %}
                    <div class="rounded-xl border border-emerald-500/20 bg-emerald-500/10 px-4 py-3 text-sm text-emerald-100">{{ success }}</div>
                {% endif %}

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="space-y-1.5">
                        <label class="block uppercase font-bold tracking-wider text-slate-500 text-[10px]">First Name</label>
                        <input type="text" id="firstName" name="first_name" value="{{ initial.first_name|default:'' }}" class="w-full rounded-lg px-3 py-2.5 text-slate-200 border border-slate-700/60 focus:outline-none focus:border-cyan-700 font-medium placeholder-slate-600 tracking-wide" style="background-color: var(--bg-input);" required>
                    </div>
                    <div class="space-y-1.5">
                        <label class="block uppercase font-bold tracking-wider text-slate-500 text-[10px]">Last Name</label>
                        <input type="text" id="lastName" name="last_name" value="{{ initial.last_name|default:'' }}" class="w-full rounded-lg px-3 py-2.5 text-slate-200 border border-slate-700/60 focus:outline-none focus:border-cyan-700 font-medium placeholder-slate-600 tracking-wide" style="background-color: var(--bg-input);" required>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="space-y-1.5">
                        <label class="block uppercase font-bold tracking-wider text-slate-500 text-[10px]">Patron ID</label>
                        <input type="text" value="{{ patron.patron_id }}" readonly class="w-full rounded-lg px-3 py-2.5 text-slate-200 border border-slate-700/60 bg-slate-900 focus:outline-none font-mono tracking-wide" style="background-color: var(--bg-input);">
                    </div>
                    <div class="space-y-1.5">
                        <label class="block uppercase font-bold tracking-wider text-slate-500 text-[10px]">Patron Type</label>
                        <div class="relative">
                            <select id="patronType" name="patron_type" class="w-full rounded-lg px-3 py-2.5 text-slate-200 border border-slate-700/60 focus:outline-none focus:border-cyan-700 font-medium appearance-none pr-10 cursor-pointer tracking-wide" style="background-color: var(--bg-input);" required>
                                <option value="">Select type...</option>
                                <option value="student" {% if initial.patron_type == 'student' %}selected{% endif %}>Student</option>
                                <option value="faculty" {% if initial.patron_type == 'faculty' %}selected{% endif %}>Faculty</option>
                                <option value="staff" {% if initial.patron_type == 'staff' %}selected{% endif %}>Staff</option>
                            </select>
                            <i class="fa-solid fa-chevron-down absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 text-[10px] pointer-events-none"></i>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="space-y-1.5">
                        <label class="block uppercase font-bold tracking-wider text-slate-500 text-[10px]">Email</label>
                        <input type="email" id="email" name="email" value="{{ initial.email|default:'' }}" class="w-full rounded-lg px-3 py-2.5 text-slate-200 border border-slate-700/60 focus:outline-none focus:border-cyan-700 font-mono tracking-wide" style="background-color: var(--bg-input);" required>
                    </div>
                    <div class="space-y-1.5">
                        <label class="block uppercase font-bold tracking-wider text-slate-500 text-[10px]">Contact</label>
                        <input type="text" id="contact" name="contact" value="{{ initial.contact|default:'' }}" class="w-full rounded-lg px-3 py-2.5 text-slate-200 border border-slate-700/60 focus:outline-none focus:border-cyan-700 font-medium tracking-wide" style="background-color: var(--bg-input);">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="space-y-1.5">
                        <label class="block uppercase font-bold tracking-wider text-slate-500 text-[10px]">Course / Department</label>
                        <input type="text" id="course" name="course_department" value="{{ initial.course_department|default:'' }}" class="w-full rounded-lg px-3 py-2.5 text-slate-200 border border-slate-700/60 focus:outline-none focus:border-cyan-700 font-medium tracking-wide" style="background-color: var(--bg-input);">
                    </div>
                    <div class="space-y-1.5">
                        <label class="block uppercase font-bold tracking-wider text-slate-500 text-[10px]">Status</label>
                        <select id="status" name="status" class="w-full rounded-lg px-3 py-2.5 text-slate-200 border border-slate-700/60 focus:outline-none focus:border-cyan-700 font-medium appearance-none pr-10 cursor-pointer tracking-wide" style="background-color: var(--bg-input);">
                            <option value="Active" {% if initial.status == 'Active' %}selected{% endif %}>Active</option>
                            <option value="Inactive" {% if initial.status == 'Inactive' %}selected{% endif %}>Inactive</option>
                        </select>
                    </div>
                </div>

                <div class="pt-4 flex items-center justify-end gap-3">
                    <button type="button" onclick="window.location.href='{% url 'admin_manage_patron' %}'" class="px-5 py-2.5 rounded-lg border border-slate-700/80 text-slate-300 hover:text-slate-100 hover:bg-slate-800/40 font-semibold tracking-wide transition-colors min-w-[100px]">
                        Cancel
                    </button>
                    <button type="submit" class="bg-cyan-700 hover:bg-cyan-600 text-white font-bold px-5 py-2.5 rounded-lg flex items-center gap-2 tracking-wide transition-colors shadow-md">
                        <i class="fa-solid fa-check text-xs"></i> Save Changes
                    </button>
                </div>

            </form>

        </div>
    </div>

</body>
</html>
