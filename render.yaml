# Render Blueprint for AYLA. The database is Supabase PostgreSQL (set the DATABASE_* values).
services:
  - type: web
    name: ayla-library
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    startCommand: gunicorn ayla_library_system.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /healthz/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DAILY_TASK_TOKEN
        generateValue: true
      - key: DATABASE_ENGINE
        value: postgresql
      - key: DATABASE_SSLMODE
        value: require
      - key: DATABASE_NAME
        sync: false
      - key: DATABASE_USER
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: DATABASE_HOST
        sync: false
      - key: DATABASE_PORT
        value: "5432"
      - key: EMAIL_PROVIDER
        sync: false
      - key: EMAIL_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
