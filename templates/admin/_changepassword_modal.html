{# Change password modal for staff and admins. #}
{% load static %}
{% firstof accent 'cyan' as pw_accent %}

<div id="portalPwModal" class="fixed inset-0 z-[80] hidden items-center justify-center p-4" style="background: var(--scrim);">
    <div class="w-full max-w-sm rounded-2xl border shadow-2xl" style="background-color: var(--bg-modal); border-color: var(--border-modal);">
        <div class="flex items-center justify-between px-6 py-4 border-b" style="border-color: var(--border-modal);">
            <h3 class="text-sm font-bold text-slate-200 tracking-wide">Change Password</h3>
            <button type="button" onclick="closePortalPwModal()" class="text-slate-500 hover:text-slate-300" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <div class="px-6 py-5 space-y-4">
            <div id="portalPwStep1" class="space-y-4">
                <div>
                    <label for="portalPwCurrent" class="text-[10px] uppercase tracking-wide text-slate-500 font-bold">Current password</label>
                    <input type="password" id="portalPwCurrent" autocomplete="current-password" class="mt-1.5 w-full bg-slate-950/80 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-300 focus:outline-none focus:border-{{ pw_accent }}-800">
                </div>
                <div>
                    <label for="portalPwNew" class="text-[10px] uppercase tracking-wide text-slate-500 font-bold">New password</label>
                    <input type="password" id="portalPwNew" autocomplete="new-password" placeholder="At least 8 characters" class="mt-1.5 w-full bg-slate-950/80 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-300 placeholder-slate-600 focus:outline-none focus:border-{{ pw_accent }}-800">
                </div>
                <p class="text-[11px] text-slate-500 leading-relaxed">We'll email you a 6-digit code to confirm the change.</p>
            </div>

            <div id="portalPwStep2" class="hidden space-y-4">
                <div>
                    <label for="portalPwCode" class="text-[10px] uppercase tracking-wide text-slate-500 font-bold">Verification code</label>
                    <input type="text" id="portalPwCode" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="one-time-code" class="mt-1.5 w-full bg-slate-950/80 border border-slate-800 rounded-lg px-3 py-2 text-center text-base font-bold tracking-[0.4em] text-slate-200 placeholder-slate-700 focus:outline-none focus:border-{{ pw_accent }}-800">
                </div>
                <p class="text-[11px] text-slate-500 leading-relaxed">Sent to your account's email address. It expires in 10 minutes.</p>
            </div>

            <div id="portalPwError" class="hidden rounded-lg border border-rose-500/20 bg-rose-500/10 px-3 py-2 text-rose-200 text-[11px]"></div>
            <div id="portalPwOk" class="hidden rounded-lg border border-emerald-500/20 bg-emerald-500/10 px-3 py-2 text-emerald-200 text-[11px]"></div>

            <div class="flex items-center justify-end gap-2 pt-1">
                <button type="button" onclick="closePortalPwModal()" class="text-xs font-semibold px-4 py-2 rounded-lg border border-slate-700 text-slate-300 hover:bg-slate-800/50">Cancel</button>
                <button type="button" id="portalPwSubmit" onclick="portalPwSubmit()" class="text-xs font-bold px-4 py-2 rounded-lg border bg-{{ pw_accent }}-700/40 text-{{ pw_accent }}-200 border-{{ pw_accent }}-700/60 hover:bg-{{ pw_accent }}-700/60">Send code</button>
            </div>
        </div>
    </div>
</div>

<form id="portalPwCsrf" style="display:none">{% csrf_token %}</form>

<script>
(function () {
    const CSRF = document.querySelector('#portalPwCsrf [name=csrfmiddlewaretoken]').value;
    const URL_CHANGE = "{% url 'portal_change_password' %}";
    let stage = 'request', busy = false;

    function el(id) { return document.getElementById(id); }
    function show(box, msg) { box.textContent = msg; box.classList.remove('hidden'); }
    function clearAlerts() {
        el('portalPwError').classList.add('hidden');
        el('portalPwOk').classList.add('hidden');
    }

    window.openPortalPwModal = function () {
        stage = 'request';
        clearAlerts();
        el('portalPwCurrent').value = '';
        el('portalPwNew').value = '';
        el('portalPwCode').value = '';
        el('portalPwStep1').classList.remove('hidden');
        el('portalPwStep2').classList.add('hidden');
        el('portalPwSubmit').textContent = 'Send code';
        el('portalPwSubmit').disabled = false;
        const m = el('portalPwModal');
        m.classList.remove('hidden'); m.classList.add('flex');
        el('portalPwCurrent').focus();
    };

    window.closePortalPwModal = function () {
        const m = el('portalPwModal');
        m.classList.add('hidden'); m.classList.remove('flex');
    };

    window.portalPwSubmit = async function () {
        if (busy) return;
        clearAlerts();
        const btn = el('portalPwSubmit');
        const label = btn.textContent;

        // Send both passwords with the code.
        const body = new URLSearchParams({
            action: stage === 'request' ? 'request' : 'verify',
            current_password: el('portalPwCurrent').value,
            new_password: el('portalPwNew').value,
        });
        if (stage === 'verify') {
            const code = el('portalPwCode').value.trim();
            if (!code) { show(el('portalPwError'), 'Enter the code from your email.'); return; }
            body.append('code', code);
        }

        busy = true;
        btn.disabled = true;
        btn.textContent = stage === 'request' ? 'Sending…' : 'Confirming…';
        try {
            const res = await fetch(URL_CHANGE, {
                method: 'POST', body,
                headers: { 'X-CSRFToken': CSRF, 'X-Requested-With': 'XMLHttpRequest' },
            });
            const data = await res.json();
            if (!data.success) { show(el('portalPwError'), data.error || 'Could not complete that.'); return; }

            if (data.stage === 'otp') {
                stage = 'verify';
                el('portalPwStep1').classList.add('hidden');
                el('portalPwStep2').classList.remove('hidden');
                btn.textContent = 'Confirm change';
                show(el('portalPwOk'), 'Verification code sent to your email.');
                el('portalPwCode').focus();
                return;
            }

            show(el('portalPwOk'), 'Password changed.');
            el('portalPwStep2').classList.add('hidden');
            btn.classList.add('hidden');
            setTimeout(window.closePortalPwModal, 1400);
        } catch (err) {
            show(el('portalPwError'), 'Network error — please try again.');
        } finally {
            busy = false;
            if (!btn.classList.contains('hidden')) {
                btn.disabled = false;
                if (el('portalPwOk').classList.contains('hidden')) btn.textContent = label;
            }
        }
    };

    el('portalPwModal').addEventListener('click', function (e) {
        if (e.target === this) window.closePortalPwModal();
    });
})();
</script>
<script src="{% static 'js/password-toggle.js' %}" defer></script>
