{# Who wrote the book: each author's first, middle and surname in their own boxes. #}
<style>
    .af { display: flex; flex-direction: column; gap: 8px; }
    .af-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--text-muted); }
    .af-hint { font-size: 10px; color: var(--text-muted); }
    .af-rows { display: flex; flex-direction: column; gap: 8px; }
    .af-row { display: flex; align-items: center; gap: 6px; }
    .af-row .af-boxes { flex: 1; }
    .af-row.is-off { opacity: .45; }
    .af-remove { flex-shrink: 0; width: 28px; height: 28px; border-radius: 6px; color: var(--text-muted); }
    .af-remove:hover { color: var(--danger); background: var(--tint-danger); }
    .af-boxes { display: grid; gap: 6px; grid-template-columns: repeat(auto-fit, minmax(7.5rem, 1fr)); }
    .af-input { width: 100%; background: var(--bg-input); border: 1px solid var(--border-modal, var(--border-color)); border-radius: 8px; padding: 8px 10px; font-size: 14px; font-weight: 500; color: var(--text-primary); outline: none; }
    .af-input:focus { border-color: var(--accent-strong, var(--accent)); }
    .af-input:disabled { cursor: not-allowed; }
    .af-input.is-wrong { border-color: var(--danger); }
    .af-foot { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; font-size: 11px; color: var(--text-muted); }
    .af-add { font-weight: 700; color: var(--accent); }
    .af-add:hover { text-decoration: underline; }
    .af-tick { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
    .af-tick input { accent-color: var(--accent); }
</style>
<div class="af" data-author-fields id="{{ prefix }}Authors"{% if initial %} data-initial="{{ initial }}"{% endif %}>
    <div class="flex flex-wrap items-baseline justify-between gap-x-3">
        <span class="af-label">{{ label|default:"Author" }}</span>
        <span class="af-hint">A writer known by one name goes in Surname.</span>
    </div>
    <div class="af-rows" data-af-rows></div>
    <div class="af-foot">
        <button type="button" class="af-add" data-af-add><i class="fa-solid fa-plus text-[10px]"></i> Add another author</button>
        <label class="af-tick"><input type="checkbox" data-af-unknown> Author unknown</label>
        <label class="af-tick" title="The book names more people than are typed here"><input type="checkbox" data-af-others> And others (et al.)</label>
    </div>
    <input type="hidden" name="author" id="{{ prefix }}Author" data-af-text>
    <input type="hidden" name="authors_json" id="{{ prefix }}AuthorsJson" data-af-json>
    <template data-af-template>
        <div class="af-row" data-af-row>
            <div class="af-boxes" data-af-person>
                <input type="text" class="af-input" data-af="first" placeholder="First name" aria-label="First name" autocomplete="off">
                <input type="text" class="af-input" data-af="middle" placeholder="Middle (optional)" aria-label="Middle name" autocomplete="off">
                <input type="text" class="af-input" data-af="last" placeholder="Surname" aria-label="Surname" autocomplete="off">
            </div>
            <button type="button" class="af-remove" data-af-remove title="Remove this author" aria-label="Remove this author"><i class="fa-solid fa-xmark"></i></button>
        </div>
    </template>
</div>
