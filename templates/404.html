{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found — Ayla Public Library</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Self-contained styles. */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 24px;
            background: #f4f6f9;
            color: #0f172a;
        }
        .card {
            max-width: 520px; width: 100%;
            background: #fff;
            border: 1px solid #d9e0ea;
            border-radius: 16px;
            padding: 40px 36px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(15, 23, 42, .08);
        }
        .logo { height: 54px; margin-bottom: 22px; }
        .code { font-size: 13px; font-weight: 700; letter-spacing: .14em;
                text-transform: uppercase; color: #7c8798; }
        h1 { font-size: 22px; font-weight: 700; margin: 10px 0 12px; }
        p { font-size: 14px; line-height: 1.6; color: #55637a; margin-bottom: 26px; }
        .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        a.btn {
            display: inline-block; text-decoration: none;
            font-size: 13px; font-weight: 600;
            padding: 11px 20px; border-radius: 10px;
            border: 1px solid #0038A8; color: #0038A8;
        }
        a.btn.primary { background: #0038A8; color: #fff; }
    </style>
</head>
<body>
    <div class="card">
        <img class="logo" src="{% static 'images/ayla-logo.png' %}" alt="Ayla Public Library">
        <div class="code">Error 404</div>
        <h1>That page isn't here</h1>
        <p>
            The link may be out of date, or the record may have been removed.
            Nothing has gone wrong with your account.
        </p>
        <div class="actions">
            <a class="btn primary" href="/patron/dashboard/">Patron portal</a>
        </div>
    </div>
</body>
</html>
