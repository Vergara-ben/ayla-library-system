{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patron Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0b1510; color: #f5fff7; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { width: 100%; max-width: 420px; padding: 32px; background: rgba(7,17,10,0.92); border: 1px solid rgba(255,255,255,0.08); border-radius: 28px; box-shadow: 0 20px 80px rgba(0,0,0,0.5); }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 10px; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: #93a59a; font-weight: 700; }
        .input { position: relative; }
        .input input { width: 100%; padding: 17px 18px 17px 50px; border: none; outline: none; border-radius: 18px; background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.06); color: white; font-size: 14px; }
        .input input:focus { border-color: rgba(74,222,128,.4); box-shadow: 0 0 0 5px rgba(74,222,128,.08), 0 10px 25px rgba(74,222,128,.08); }
        .icon { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); opacity: .6; }
        .btn { width: 100%; border: none; padding: 17px; border-radius: 18px; font-size: 15px; font-weight: 800; cursor: pointer; background: linear-gradient(135deg, #4ade80, #22c55e); color: #031108; box-shadow: 0 15px 35px rgba(74,222,128,.25); }
        .error-text { color: red; margin-top: 16px; }
    </style>
</head>
<body>
    <div class="card">
        <h1 style="margin-bottom:24px;">Patron Login</h1>
        <form method="POST" action="{% url 'patron_login' %}">
            {% csrf_token %}
            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input">
                    <div class="icon">✉</div>
                    <input type="email" id="email" name="email" placeholder="name@domain.com" required>
                </div>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input">
                    <div class="icon">🔒</div>
                    <input type="password" id="password" name="password" placeholder="••••••••••" required>
                </div>
            </div>
            <button type="submit" class="btn">Continue →</button>
        </form>
        <p class="error-text">{{ error }}</p>
    </div>
</body>
</html>
