{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #070f18; color: #ffffff; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { width: 100%; max-width: 420px; padding: 36px; background: #0c1925; border: 1px solid #1e293b; border-radius: 24px; box-shadow: 0 20px 80px rgba(0,0,0,0.5); }
        .form-group { margin-bottom: 24px; }
        .form-label { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: #64748b; margin-bottom: 8px; }
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-icon { position: absolute; left: 16px; color: #38bdf8; font-size: 14px; display: flex; align-items: center; }
        .form-input { width: 100%; background-color: #0f1c2a; border: 1px solid #1e293b; border-radius: 12px; padding: 16px 16px 16px 46px; color: #ffffff; font-size: 14px; }
        .form-input:focus { outline: none; border-color: #38bdf8; box-shadow: 0 0 0 4px rgba(56,189,248,0.12); }
        .btn { width: 100%; border: none; padding: 16px; border-radius: 14px; font-size: 15px; font-weight: 700; cursor: pointer; background: #38bdf8; color: #070f18; margin-top: 10px; }
        .error-text { color: red; margin-top: 16px; }
    </style>
</head>
<body>
    <div class="card">
        <h1 style="margin-bottom:24px;">Admin Login</h1>
        <form method="POST" action="{% url 'admin_login' %}">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label" for="email">Admin Email</label>
                <div class="input-wrapper">
                    <span class="input-icon">✉</span>
                    <input type="email" id="email" name="email" class="form-input" placeholder="admin@school.edu.ph" required>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <div class="input-wrapper">
                    <span class="input-icon">🔒</span>
                    <input type="password" id="password" name="password" class="form-input" placeholder="Enter admin password" required>
                </div>
            </div>
            <button type="submit" class="btn">Sign In</button>
        </form>
        <p class="error-text">{{ error }}</p>
    </div>
</body>
</html>
