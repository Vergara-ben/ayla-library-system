{% load static %}
<!DOCTYPE html>
<html lang="en" data-module="patron" data-theme-floating>
<head>
    <meta charset="UTF-8">
    <meta name="theme-color" content="#ffffff">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patron Login</title>
    <script src="{% static 'js/theme.js' %}"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/theme.css' %}">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { width: 100%; max-width: 420px; padding: 32px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow-pop); }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 10px; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); font-weight: 700; }
        .input { position: relative; }
        .input input { width: 100%; padding: 17px 18px 17px 50px; border: none; outline: none; border-radius: 10px; background: var(--bg-input); border: 1px solid var(--border); color: var(--text); font-size: 14px; }
        .input input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }
        .icon { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); opacity: .6; }
        .btn { width: 100%; border: none; padding: 17px; border-radius: 10px; font-size: 15px; font-weight: 800; cursor: pointer; background: var(--accent); color: var(--on-accent); }
        .error-text { color: var(--danger); margin-top: 16px; }
    </style>
    <link rel="icon" type="image/png" href="{% static 'images/favicon.png' %}">
    <link rel="apple-touch-icon" href="{% static 'images/apple-touch-icon.png' %}">
</head>
<body>
    <div class="card">
        <h1 style="margin-bottom:24px;">Patron Login</h1>
        <form method="POST" action="{% url 'patron_login' %}">
            {% csrf_token %}
            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input">
                    <div class="icon">✉</div>
                    <input type="email" id="email" name="email" placeholder="name@domain.com" required>
                </div>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input">
                    <div class="icon">🔒</div>
                    <input type="password" id="password" name="password" placeholder="••••••••••" required>
                </div>
            </div>
            <button type="submit" class="btn">Continue →</button>
        </form>
        <p class="error-text">{{ error }}</p>
    </div>
</body>
</html>
