{# Hamburger that opens and closes the portal sidebar, and no login autofill in portal forms. #}
<style>
    @media (min-width: 768px) {
        html.sidebar-closed aside.w-64 { display: none !important; }
        .sidebar-backdrop { display: none; }
    }
    /* Phones: the sidebar slides in over the page. */
    @media (max-width: 767.98px) {
        html body aside.w-64 {
            position: fixed; top: 0; bottom: 0; left: 0; height: auto;
            max-width: 85vw; z-index: 55;
            transform: translateX(-100%); visibility: hidden;
            transition: transform .25s ease, visibility 0s linear .25s;
        }
        html body aside.w-64.open {
            transform: none; visibility: visible;
            transition: transform .25s ease;
            box-shadow: 12px 0 40px -12px rgba(2, 6, 23, .45);
        }
        .sidebar-backdrop {
            position: fixed; inset: 0; z-index: 54;
            background: var(--scrim, rgba(15, 23, 42, .45));
            opacity: 0; pointer-events: none; transition: opacity .25s ease;
        }
        aside.w-64.open ~ .sidebar-backdrop { opacity: 1; pointer-events: auto; }
        .sidebar-toggle.has-page-menu { display: none; }
    }
    @media (max-width: 767.98px) and (prefers-reduced-motion: reduce) {
        html body aside.w-64, .sidebar-backdrop { transition: none !important; }
    }
    .sidebar-toggle {
        width: 36px; height: 36px; margin-right: 14px; flex-shrink: 0;
        display: inline-flex; align-items: center; justify-content: center;
        border-radius: 10px; border: 1px solid var(--border-color);
        background: transparent; color: var(--text-muted, #94a3b8); cursor: pointer;
        transition: color .15s ease, background-color .15s ease;
    }
    .sidebar-toggle:hover { color: var(--text-main, #e2e8f0); background: rgba(148, 163, 184, .12); }
</style>
<div class="sidebar-backdrop" aria-hidden="true"></div>
<script>
(function () {
    const KEY = 'ayla.sidebar';
    const PHONE = window.matchMedia('(max-width: 767.98px)');
    // Applied before the page paints, so a closed sidebar does not flash open.
    try { if (localStorage.getItem(KEY) === 'closed') document.documentElement.classList.add('sidebar-closed'); } catch (e) { /* open */ }

    function sidebar() { return document.querySelector('aside.w-64'); }

    function syncButton() {
        const btn = document.getElementById('sidebarToggle');
        if (!btn) return;
        const aside = sidebar();
        const open = PHONE.matches ? !!(aside && aside.classList.contains('open'))
                                   : !document.documentElement.classList.contains('sidebar-closed');
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    }

    function setOpen(open) {
        document.documentElement.classList.toggle('sidebar-closed', !open);
        try { localStorage.setItem(KEY, open ? 'open' : 'closed'); } catch (e) { /* not kept */ }
        syncButton();
        // Maps and charts measure their box, so tell them it changed.
        window.dispatchEvent(new Event('resize'));
    }

    // Phones: the sidebar slides over the page instead of taking room beside it.
    function setDrawer(open) {
        const aside = sidebar();
        if (aside) aside.classList.toggle('open', open);
        syncButton();
    }

    function addButton() {
        const header = Array.prototype.find.call(document.querySelectorAll('header'),
            function (h) { return !h.closest('aside'); });
        if (!header || document.getElementById('sidebarToggle')) return;
        let left = header.firstElementChild;
        if (!left) return;
        // A bare title gets a row to share with the button.
        if (/^H\d$/.test(left.tagName)) {
            const row = document.createElement('div');
            row.style.display = 'flex';
            row.style.alignItems = 'center';
            header.insertBefore(row, left);
            row.appendChild(left);
            left = row;
        }
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.id = 'sidebarToggle';
        btn.className = 'sidebar-toggle';
        btn.title = 'Show or hide the menu';
        btn.setAttribute('aria-label', 'Toggle menu');
        btn.innerHTML = '<i class="fa-solid fa-bars" aria-hidden="true"></i>';
        // A page with its own phone menu button keeps that one on phones.
        if (header.querySelector('.mobile-menu-btn')) btn.classList.add('has-page-menu');
        btn.addEventListener('click', function () {
            if (PHONE.matches) {
                const aside = sidebar();
                setDrawer(!(aside && aside.classList.contains('open')));
            } else {
                setOpen(document.documentElement.classList.contains('sidebar-closed'));
            }
        });
        left.insertBefore(btn, left.firstChild);
        syncButton();
    }

    // A password box makes the browser treat the page as a login and pour the
    // saved email into nearby fields. Portal forms never want that.
    function noAutofill(root) {
        const fields = Array.prototype.slice.call(root.querySelectorAll('input, textarea, select'));
        if (root.matches && root.matches('input, textarea, select')) fields.push(root);
        fields.forEach(function (el) {
            if (el.type === 'hidden' || el.dataset.autofillOff) return;
            el.dataset.autofillOff = '1';
            el.setAttribute('autocomplete', el.type === 'password' ? 'new-password' : 'off');
        });
    }

    // A tap outside the open sidebar, or Escape, closes it.
    document.addEventListener('click', function (e) {
        if (e.target.classList && e.target.classList.contains('sidebar-backdrop')) setDrawer(false);
    });
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && PHONE.matches) setDrawer(false);
    });
    PHONE.addEventListener('change', function () { setDrawer(false); });

    document.addEventListener('DOMContentLoaded', function () {
        addButton();
        noAutofill(document);
        // Forms drawn later (modals, rows added by script) too.
        new MutationObserver(function (records) {
            records.forEach(function (r) {
                r.addedNodes.forEach(function (n) { if (n.nodeType === 1) noAutofill(n); });
            });
        }).observe(document.body, { childList: true, subtree: true });
    });
})();
</script>
