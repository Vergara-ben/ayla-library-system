{% load static %}
<!DOCTYPE html>
<html lang="en" data-module="patron" data-theme-floating>
<head>
    <meta charset="UTF-8">
    <meta name="theme-color" content="#ffffff">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patron Registration</title>
    <script src="{% static 'js/theme.js' %}"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/theme.css' %}">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { width: 100%; max-width: 500px; padding: 32px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow-pop); }
        h1 { margin-top: 0; margin-bottom: 24px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 10px; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); font-weight: 700; }
        .input { position: relative; }
        .input input, .input select { width: 100%; padding: 17px 18px 17px 50px; border: none; outline: none; border-radius: 10px; background: var(--bg-input); border: 1px solid var(--border); color: var(--text); font-size: 14px; }
        .input input:focus, .input select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }
        .input select { padding-left: 50px; }
        .input select option { background: var(--bg); color: var(--text); }
        .icon { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); opacity: .6; }
        .btn { width: 100%; border: none; padding: 17px; border-radius: 10px; font-size: 15px; font-weight: 800; cursor: pointer; background: var(--accent); color: var(--on-accent); margin-top: 10px; }
        .btn:hover { background: var(--accent-strong); }
        .error-text { color: var(--danger); margin-top: 16px; font-size: 14px; }
        .login-link { text-align: center; margin-top: 16px; font-size: 14px; color: var(--muted); }
        .login-link a { color: var(--accent); text-decoration: none; font-weight: 700; }
    </style>
    <link rel="icon" type="image/png" href="{% static 'images/favicon.png' %}">
    <link rel="apple-touch-icon" href="{% static 'images/apple-touch-icon.png' %}">
</head>
<body>
    <div class="card">
        <h1>Create Patron Account</h1>
        <form method="POST" action="{% url 'patron_register' %}">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="fullname">Full Name</label>
                <div class="input">
                    <div class="icon">👤</div>
                    <input type="text" id="fullname" name="fullname" placeholder="Your full name" required>
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input">
                    <div class="icon">✉</div>
                    <input type="email" id="email" name="email" placeholder="name@domain.com" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input">
                    <div class="icon">🔒</div>
                    <input type="password" id="password" name="password" placeholder="••••••••••" required>
                </div>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <div class="input">
                    <div class="icon">🔒</div>
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="••••••••••" required>
                </div>
            </div>

            <div class="form-group">
                <label for="patron_type">Patron Type</label>
                <div class="input">
                    <div class="icon">📋</div>
                    <select id="patron_type" name="patron_type" required>
                        <option value="">Select patron type</option>
                        <option value="Student">Student</option>
                        <option value="Teacher">Teacher</option>
                        <option value="Parent">Parent</option>
                        <option value="General Visitor">General Visitor</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="contact_number">Contact Number</label>
                <div class="input">
                    <div class="icon">📞</div>
                    <input type="text" id="contact_number" name="contact_number" placeholder="09xxxxxxxxx" required>
                </div>
            </div>

            <div class="form-group">
                <label for="address">Address</label>
                <div class="input">
                    <div class="icon">📍</div>
                    <input type="text" id="address" name="address" placeholder="Your address" required>
                </div>
            </div>

            <button type="submit" class="btn">Create Account →</button>
        </form>

        {% if error %}
        <p class="error-text">{{ error }}</p>
        {% endif %}

        <div class="login-link">
            Already have an account? <a href="{% url 'patron_login' %}">Sign In</a>
        </div>
    </div>
</body>
</html>
